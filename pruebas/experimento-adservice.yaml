apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: demo-adservice
  namespace: online-boutique
  annotations:
    pruebas/alerta-esperada: "DeploymentReplicasNoDisponibles"
    pruebas/deteccion-max-seg: "120"
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces: [online-boutique]
    labelSelectors:
      app: adservice
  duration: "60s"
